server:
  port: 8110

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  internal-token: ${INTERNAL_CALL_TOKEN}

spring:
  application:
    name: search-service
  datasource:
    url: jdbc:mysql://localhost:3306/collab_office?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

logging:
  level:
    com.collaboffice: ${LOG_LEVEL:INFO}
    com.alibaba.nacos: WARN
